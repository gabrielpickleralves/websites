<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pickler v2</title>
<!--
  Briefing v2, em tela cheia vertical (1080x1920), 30 fps. A sequência de 15 s abaixo roda 3 vezes (45 s em loop; quadro 1350 = quadro 0).
  Cada passagem troca a paleta (limão + violeta, laranja + azul, rosa + turquesa), com o fundo mudando
  junto nos últimos 2 s de cada uma, e inverte as linhas cinéticas;
  partículas e cards seguem contínuos pelos 45 s.
  0,0–2,5   partículas e cards subindo; letra por letra com mola; bloom aumentando
  2,5–4,5   close-up com dolly zoom (palavra 2.2→1.0, fundo 1.0→0.85); reflexo especular
  4,5–6,5   revelação por máscara com borda ciano; kinetic type entra pelas laterais
  6,5–8,5   flash ciano; glitch RGB com scanlines em rajadas; respiração
  8,5–10,5  parallax 0.3x / 1x / 1.6x com câmera lateral de 120 px; linhas de luz
  10,5–12,0 rack focus nos cards; cards aceleram (e desaceleram depois, para o loop fechar)
  12,0–13,0 flash branco; palavra isolada
  13,0–15,0 a palavra se desfaz em partículas; fundo volta ao estado inicial
-->
<style>
@font-face{font-family:"Inter";src:url(fontes/Inter800.woff2);font-weight:800}
@font-face{font-family:"Unbounded";src:url(fontes/Unbounded.woff2)}
@font-face{font-family:"Playfair Display";src:url(fontes/PlayfairDisplay.woff2)}
@font-face{font-family:"Space Mono";src:url(fontes/SpaceMono.woff2)}
@font-face{font-family:"Syne";src:url(fontes/Syne.woff2)}
@font-face{font-family:"Bodoni Moda";src:url(fontes/BodoniModa.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;height:100vh;width:auto;margin:0 auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" role="img" aria-label="Pickler"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 45, SEG = 15;
const WH = '#FFFFFF';
// uma paleta por passagem de 15 s: cor principal, complementar e centro do fundo
const PALS = [
  { main: '#B6FF3B', comp: '#8A5CFF', bg: '#0C1A0E' },   // limão + violeta
  { main: '#FF7A1A', comp: '#2E7BFF', bg: '#1A0E06' },   // laranja + azul
  { main: '#FF3D6E', comp: '#2CE6C4', bg: '#1A0814' },   // rosa + turquesa
];
const CY_ = PALS[0].main, MG = PALS[0].comp, AM = PALS[1].main;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const WORD = 'Pickler', MAINF = '"Inter"';
const CX = W / 2, CY = H / 2;
let MAINCOL = CY_, COMP = MG, FLIP = 1, BGC = PALS[0].bg;   // mudam a cada passagem de 15 s
const mixHex = (a, b, p) => '#' + [0, 8, 16].map(s => Math.round(lerp((parseInt(a.slice(1), 16) >> (16 - s)) & 255, (parseInt(b.slice(1), 16) >> (16 - s)) & 255, p)).toString(16).padStart(2, '0')).join('');

const c = document.getElementById('c'), x = c.getContext('2d', { willReadFrequently: true });
const mk = (w, h) => { const k = document.createElement('canvas'); k.width = w; k.height = h; return [k, k.getContext('2d', { willReadFrequently: true })]; };
const [bloomC, bloomX] = mk(270, 480);
const [bdC, bdX] = mk(540, 960);          // fundo desfocado para o vidro dos cards
const [wordC, wordX] = mk(W, H);          // camada da palavra (reflexo e máscara)

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function spring(t, k = 170, d = 15) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0), wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
}
const TAU = Math.PI * 2;

// brilho em pontos: sprite pronto por cor
const sprite = col => {
  const [k, kx] = mk(64, 64), g = kx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, '#fff'); g.addColorStop(0.15, col); g.addColorStop(0.45, rgba(col, 0.25)); g.addColorStop(1, rgba(col, 0));
  kx.fillStyle = g; kx.fillRect(0, 0, 64, 64); return k;
};
const COLS = [...PALS.flatMap(p => [p.main, p.comp]), WH];
const SPR = Object.fromEntries(COLS.map(col => [col, sprite(col)]));

// ---------- estado global por tempo (tudo volta ao início em t = 15) ----------
function cardTime(T) {
  // aceleram em 10,5–12 e desaceleram até 15: a integral fecha em zero, o loop não salta
  const t = T % SEG;
  const g = t < 10.5 ? 0 : t < 12 ? easeInOut(prog(t, 10.5, 1.5)) : 1 - easeInOut(prog(t, 12, 3));
  return T + 1.2 * g;
}
const bgScale = t => t < 2.5 ? 1 : t < 13 ? lerp(1, 0.85, easeOutExpo(prog(t, 2.5, 1.4))) : lerp(0.85, 1, easeInOut(prog(t, 13, 2)));
const camX = t => t >= 8.5 && t < 12 ? lerp(-60, 60, easeInOut(prog(t, 8.5, 2))) : 0;
function bloomA(t) {
  if (t < 2.5) return lerp(0.1, 0.35, t / 2.5);
  if (t >= 12 && t < 12.4) return lerp(0.9, 0.35, prog(t, 12, 0.4));
  if (t >= 13) return lerp(0.35, 0.1, easeInOut(prog(t, 13, 2)));
  return 0.35;
}
const isolated = t => t >= 12 && t < 13 ? 0.25 : t >= 13 ? lerp(0.25, 1, easeInOut(prog(t, 13, 1.5))) : 1;

// ---------- 9. partículas de luz (ciclos que dividem 15 s) ----------
const PARTS = Array.from({ length: 80 }, (_, i) => {
  const depth = hash(i + 3);                             // 0 = longe (menor, desfocada, lenta)
  const k = [1, 2, 3, 4, 5][Math.floor(hash(i + 9) * 5)];
  return { i, depth, life: SEG / k, k, speed: lerp(8, 30, depth), size: lerp(1, 3, depth), col: COLS[Math.floor(hash(i + 21) * COLS.length)], tw: 1 + Math.floor(hash(i + 33) * 6) };
});
function particles(t, alpha) {
  for (const p of PARTS) {
    const cyc = Math.floor(t / p.life) % (p.k * 3), u = (t % p.life) / p.life;
    const px = hash(p.i * 7 + cyc * 13) * W, py = H * 0.15 + hash(p.i * 5 + cyc * 17) * H * 0.85 - p.speed * u * p.life;
    const tw = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(TAU * p.tw * t / DUR * 12 + p.i));
    x.globalAlpha = Math.sin(Math.PI * u) * tw * alpha;
    const s = p.size * lerp(14, 8, p.depth);             // sprite inclui o glow; as de longe ficam mais moles
    x.drawImage(SPR[p.col], px - s / 2, py - s / 2, s, s);
  }
  x.globalAlpha = 1;
}

// ---------- 8. cards de vidro subindo ----------
const CFONTS = ['"Inter"', '"Unbounded"', '"Playfair Display"', '"Space Mono"', '"Syne"', '"Bodoni Moda"'];
const CARDS = Array.from({ length: 16 }, (_, i) => {
  const sp = lerp(80, 180, hash(i + 101)), k = Math.max(1, Math.floor(sp * DUR / 2300));
  return { i, sp, range: sp * DUR / k, y0: hash(i + 202), x: 120 + hash(i + 303) * (W - 240), rot: (hash(i + 404) - 0.5) * 16 * Math.PI / 180,
    sc: lerp(0.3, 0.6, hash(i + 505)), f: CFONTS[i % CFONTS.length], col: COLS[Math.floor(hash(i + 606) * COLS.length)] };
});
function cardBlur(t) {
  if (t >= 10.3 && t < 10.5) return lerp(3, 24, prog(t, 10.3, 0.2));
  if (t >= 10.5 && t < 12) return lerp(24, 0, easeOut(prog(t, 10.5, 0.8)));
  return 3;
}
// cada card é desenhado uma vez, já em 5 níveis de desfoque; por quadro só se misturam os dois mais próximos
const BLURS = [0, 3, 8, 16, 24], CPAD = 70;
function buildCardSprites() {
  for (const cd of CARDS) {
    const cw = 420 * cd.sc, ch = 190 * cd.sc;
    const [base, bx] = mk(Math.ceil(cw + CPAD * 2), Math.ceil(ch + CPAD * 2));
    bx.translate(base.width / 2, base.height / 2);
    bx.beginPath(); bx.roundRect(-cw / 2, -ch / 2, cw, ch, 28 * cd.sc);
    bx.fillStyle = 'rgba(255,255,255,0.06)'; bx.fill();
    bx.strokeStyle = 'rgba(255,255,255,0.25)'; bx.lineWidth = 1; bx.stroke();
    bx.font = `800 ${ch * 0.42}px ${cd.f}`; bx.textAlign = 'center'; bx.textBaseline = 'middle';
    bx.shadowColor = cd.col; bx.shadowBlur = 10; bx.fillStyle = cd.col; bx.fillText(WORD, 0, 2);
    cd.spr = BLURS.map(b => {
      if (!b) return base;
      const [k, kx] = mk(base.width, base.height); kx.filter = `blur(${b}px)`; kx.drawImage(base, 0, 0); return k;
    });
  }
}
function cards(T, alpha) {
  const t = T % SEG, ct = cardTime(T), blur = cardBlur(t);
  const bright = t >= 10.5 && t < 12 ? 1 + 0.5 * Math.sin(Math.PI * prog(t, 10.5, 1.5)) : 1;
  const v = t >= 10.5 && t < 12 ? 1 + 1.2 * Math.sin(Math.PI * prog(t, 10.5, 1.5)) : 1;  // fator de velocidade p/ rastro
  let li = 0; while (li < BLURS.length - 2 && blur > BLURS[li + 1]) li++;
  const mixB = clamp((blur - BLURS[li]) / (BLURS[li + 1] - BLURS[li]));
  for (const cd of CARDS) {
    const y = H + 150 - ((cd.y0 * cd.range + cd.sp * ct) % cd.range);
    const u = clamp((H + 150 - y) / (H + 300));
    const a = Math.sin(Math.PI * u) * alpha;
    if (a <= 0.01) continue;
    const cw = 420 * cd.sc, ch = 190 * cd.sc, sw = cd.spr[0].width, sh = cd.spr[0].height;
    const smear = Math.max(1, Math.round(v * 2));          // 14. rastro vertical quando aceleram
    for (let s = 0; s < smear; s++) {
      x.save();
      x.translate(cd.x, y + s * 4); x.rotate(cd.rot);
      x.globalAlpha = a / smear;
      // vidro: o fundo desfocado aparece só dentro do card (recorte da área em volta)
      x.save();
      x.beginPath(); x.roundRect(-cw / 2, -ch / 2, cw, ch, 28 * cd.sc); x.clip();
      const m = x.getTransform(), sc = Math.hypot(m.a, m.b), r = Math.hypot(cw, ch) / 2 * sc + 4;
      x.setTransform(1, 0, 0, 1, 0, 0);
      x.drawImage(bdC, (m.e - r) / 2, (m.f - r) / 2, r, r, m.e - r, m.f - r, r * 2, r * 2);
      x.restore();
      x.globalAlpha = a / smear * (1 - mixB); x.drawImage(cd.spr[li], -sw / 2, -sh / 2);
      x.globalAlpha = a / smear * mixB; x.drawImage(cd.spr[li + 1], -sw / 2, -sh / 2);
      if (bright > 1) {                                     // brilho extra ao entrar em foco
        x.globalCompositeOperation = 'lighter'; x.globalAlpha = a / smear * (bright - 1);
        x.drawImage(cd.spr[mixB < 0.5 ? li : li + 1], -sw / 2, -sh / 2);
      }
      x.restore();
    }
  }
}

// ---------- primeiro plano (1.6x): bokeh grande e desfocado ----------
const BOKEH = Array.from({ length: 9 }, (_, i) => ({ x: hash(i + 700) * W, y: hash(i + 800) * H, r: 60 + hash(i + 900) * 90, col: COLS[i % 6] }));
function foreground(t, alpha) {
  for (const b of BOKEH) {
    x.globalAlpha = alpha * (0.06 + 0.05 * Math.sin(TAU * 2 * t / SEG + b.x));
    x.drawImage(SPR[b.col], b.x + camX(t) * 1.6 - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }
  x.globalAlpha = 1;
}

// ---------- 10. linhas de luz ----------
const TRAILS = [[2.35, 0.5], [4.35, 0.5], [8.6, 1.5], [11.9, 0.4]];
function lightTrails(t) {
  TRAILS.forEach(([s, d], g) => {
    const p = prog(t, s, d); if (p <= 0 || p >= 1) return;
    const n = g === 2 ? 5 : 3;
    for (let k = 0; k < n; k++) {
      const q = clamp(p * 1.4 - k * 0.1); if (q <= 0) continue;
      const off = (hash(g * 10 + k) - 0.5) * H * 1.2, col = [MAINCOL, COMP, WH][k % 3];
      const hx = lerp(-300, W + 300, q), hy = lerp(H + 200, -200, q) + off;
      const tx = hx - 520, ty = hy + 300;
      const gr = x.createLinearGradient(tx, ty, hx, hy);
      gr.addColorStop(0, rgba(col, 0)); gr.addColorStop(1, rgba(col, 0.9));
      x.strokeStyle = gr; x.lineWidth = 2.5; x.shadowColor = col; x.shadowBlur = 16;
      x.beginPath(); x.moveTo(tx, ty); x.lineTo(hx, hy); x.stroke();
      x.shadowBlur = 0;
    }
  });
}

// ---------- palavra principal com o sistema de brilho ----------
let SIZE = 0;
function glowText(ctx, str, px, py, col = MAINCOL, glow = 1) {
  ctx.fillStyle = WH;
  // shadowBlur do canvas = 2x o raio do drop-shadow do CSS do briefing (8 / 24 / 60 px)
  ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fillText(str, px, py);                     // brilho interno
  ctx.shadowColor = rgba(col, 0.6 * glow); ctx.shadowBlur = 48; ctx.fillText(str, px, py);   // halo médio
  ctx.shadowColor = rgba(COMP, 0.3 * glow); ctx.shadowBlur = 120; ctx.fillText(str, px, py);   // bloom externo (complementar)
  ctx.shadowBlur = 0;
}
// desenha a palavra na camada wordC; letter(i) -> {dy, a}
function drawWord(o = {}) {
  const { letter = null, glow = 1, col = MAINCOL } = o;
  wordX.setTransform(1, 0, 0, 1, 0, 0); wordX.clearRect(0, 0, W, H);
  wordX.font = `800 ${SIZE}px ${MAINF}`; wordX.textBaseline = 'alphabetic'; wordX.textAlign = 'left';
  const m = wordX.measureText(WORD), base = CY + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  const left = CX - m.width / 2;
  if (!letter) { glowText(wordX, WORD, left, base, col, glow); return; }
  [...WORD].forEach((ch, i) => {
    const L = letter(i); if (L.a <= 0) return;
    const px = left + wordX.measureText(WORD.slice(0, i)).width;
    wordX.globalAlpha = L.a;
    const steps = Math.abs(L.vy) > 60 ? 4 : 1;             // 14. rastro vertical na subida
    for (let s = 0; s < steps; s++) { wordX.globalAlpha = L.a / steps; glowText(wordX, ch, px, base + L.dy + s * 3 * Math.sign(L.vy), col, glow); }
    wordX.globalAlpha = 1;
  });
}
// coloca a camada da palavra no quadro com escala, blur e deslocamento
function placeWord({ scale = 1, blur = 0, dx = 0, alpha = 1, clipX = null, comp = 'source-over' } = {}) {
  x.save();
  x.globalAlpha = alpha; x.globalCompositeOperation = comp;
  if (clipX) { x.beginPath(); x.rect(clipX[0], 0, clipX[1] - clipX[0], H); x.clip(); }
  if (blur > 0.2) x.filter = `blur(${blur}px)`;
  x.translate(CX + dx, CY); x.scale(scale, scale); x.translate(-CX, -CY);
  x.drawImage(wordC, 0, 0);
  x.restore();
}
const breathe = t => 1 + 0.01 * (1 - Math.cos(TAU * t / 3));   // 11. 1.0 → 1.02 → 1.0 a cada 3 s

// 3. reflexo especular: faixa branca a 25°, 15% de largura, só dentro das letras
function sheen(p, scale) {
  const [k, kx] = [sheenC, sheenX];
  kx.setTransform(1, 0, 0, 1, 0, 0); kx.globalCompositeOperation = 'source-over'; kx.clearRect(0, 0, W, H);
  kx.drawImage(wordC, 0, 0);
  kx.globalCompositeOperation = 'source-in';
  const bw = W * 0.15, cx0 = lerp(CX - 650, CX + 650, p);
  kx.translate(cx0, CY); kx.rotate(25 * Math.PI / 180);
  const g = kx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  kx.fillStyle = g; kx.fillRect(-bw / 2, -H, bw, H * 2);
  x.save(); x.globalCompositeOperation = 'screen';
  x.translate(CX, CY); x.scale(scale, scale); x.translate(-CX, -CY); x.drawImage(k, 0, 0); x.restore();
}
const [sheenC, sheenX] = mk(W, H);

// 13. kinetic type: 3 linhas, velocidades 40 / 70 / 110 px/s
const ROWS = [[H * 0.2, -1, 40, 0.18], [CY, 1, 70, 0.07], [H * 0.8, 1, 110, 0.12]];
function kinetic(t) {
  const enter = easeOut(prog(t, 4.6, 0.9)), out = 1 - easeInOut(prog(t, 8.0, 0.5));
  if (enter <= 0 || out <= 0) return;
  x.font = `800 190px ${MAINF}`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const unit = WORD + '   ', uw = x.measureText(unit).width;
  ROWS.forEach(([y, dir, v, a], r) => {
    const off = ((FLIP * dir * v * t) % uw + uw) % uw, slide = (1 - enter) * W * (r % 2 ? 1 : -1);
    for (let s = 0; s < 4; s++) {                          // 14. rastro horizontal
      x.globalAlpha = a * enter * out / 4;
      x.strokeStyle = r === 1 ? MAINCOL : WH; x.lineWidth = 2;
      for (let px = -uw * 2 - off + slide + dir * s * 3; px < W + uw; px += uw) x.strokeText(unit, px, y);
    }
  });
  x.globalAlpha = 1;
}

// 5. glitch: três cópias (ciano, magenta, âmbar) separadas e deslocadas, scanlines por cima
const BURSTS = [[6.7, 4], [7.3, 3], [7.9, 5]];
const burstAt = f => BURSTS.some(([s, n]) => { const f0 = Math.round(s * FPS); return f >= f0 && f < f0 + n; });
function glitchWord(frame, scale) {
  const sep = 3 + hash(frame) * 3;
  [[COMP, -sep], [WH, sep], [MAINCOL, 0]].forEach(([col, dx], k) => {
    const jx = (hash(frame * 3 + k) - 0.5) * 2 * lerp(2, 8, hash(frame + k * 9)), jy = (hash(frame * 5 + k) - 0.5) * 6;
    x.save(); x.globalCompositeOperation = 'screen';
    tintC.getContext('2d').globalCompositeOperation = 'source-over';
    tintX.clearRect(0, 0, W, H); tintX.drawImage(wordC, 0, 0); tintX.globalCompositeOperation = 'source-in';
    tintX.fillStyle = col; tintX.fillRect(0, 0, W, H); tintX.globalCompositeOperation = 'source-over';
    x.translate(CX + dx + jx, CY + jy); x.scale(scale, scale); x.translate(-CX, -CY);
    x.drawImage(tintC, 0, 0); x.restore();
  });
  x.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 2);
}
const [tintC, tintX] = mk(W, H);

// 15. saída: a palavra se desfaz em partículas da esquerda para a direita
let DUST = null;
function dustPoints() {
  if (DUST) return DUST;
  const d = wordX.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 5) for (let px = 0; px < W; px += 5) if (d[(y * W + px) * 4 + 3] > 140) pts.push([px, y]);
  return (DUST = pts);
}

// ---------- fundo, bloom, aberração, vinheta, grão ----------
function background() {
  const g = x.createRadialGradient(CX, CY, 0, CX, CY, Math.hypot(CX, CY));
  g.addColorStop(0, BGC); g.addColorStop(1, '#000000');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
}
function bloom(a) {
  bloomX.filter = 'none'; bloomX.clearRect(0, 0, 270, 480);
  bloomX.filter = 'blur(10px)'; bloomX.drawImage(c, 0, 0, 270, 480); bloomX.filter = 'none';
  x.save(); x.globalCompositeOperation = 'screen'; x.globalAlpha = a; x.drawImage(bloomC, 0, 0, W, H); x.restore();
}
const IMPACT = [[2.5, 4], [6.5, 4], [6.7, 4], [7.3, 3], [7.9, 5], [12.0, 5]];
const impactAt = f => IMPACT.some(([s, n]) => { const f0 = Math.round(s * FPS); return f >= f0 && f < f0 + n; });
function aberration() {
  const img = x.getImageData(0, 0, W, H), s = img.data, out = new Uint8ClampedArray(s);
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
    const dx = (i - CX) / CX, dy = (y - CY) / CY, r = dx * dx + dy * dy;
    if (r < 0.35) continue;
    const k = Math.min(2, r * 1.2);                        // 1–2 px, só nas bordas
    const ox = Math.round(dx * k), oy = Math.round(dy * k);
    const p = (y * W + i) * 4;
    const ri = (clamp(y + oy, 0, H - 1) * W + clamp(i + ox, 0, W - 1)) * 4;
    const bi = (clamp(y - oy, 0, H - 1) * W + clamp(i - ox, 0, W - 1)) * 4;
    out[p] = s[ri]; out[p + 2] = s[bi + 2];
  }
  x.putImageData(new ImageData(out, W, H), 0, 0);
}
const [grainC, grainX] = mk(540, 960);
const GRAINS = Array.from({ length: 5 }, (_, k) => {
  const d = grainX.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = hash(i * 0.31 + k * 777) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  return d;
});
function finish(frame) {
  const v = x.createRadialGradient(CX, CY, H * 0.45, CX, CY, Math.hypot(CX, CY));
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.2)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  grainX.putImageData(GRAINS[frame % GRAINS.length], 0, 0);
  x.save(); x.globalAlpha = 0.04; x.globalCompositeOperation = 'overlay'; x.drawImage(grainC, 0, 0, W, H); x.restore();
}

// ---------- roteiro ----------
function render(frame) {
  frame = ((frame % (DUR * FPS)) + DUR * FPS) % (DUR * FPS);   // quadro 1350 = quadro 0
  const T = frame / FPS, PASS = Math.floor(T / SEG), t = T - PASS * SEG, fl = frame - PASS * SEG * FPS;
  MAINCOL = PALS[PASS].main; COMP = PALS[PASS].comp; FLIP = PASS % 2 ? -1 : 1;
  BGC = mixHex(PALS[PASS].bg, PALS[(PASS + 1) % 3].bg, easeInOut(prog(t, 13, 2)));
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none'; x.globalCompositeOperation = 'source-over';
  const iso = isolated(t);

  // camada de fundo (0.3x), com escala do dolly
  background();
  x.save();
  x.translate(CX + camX(t) * 0.3, CY); x.scale(bgScale(t), bgScale(t)); x.translate(-CX, -CY);
  particles(T, iso);
  x.restore();
  bdX.filter = 'blur(6px)'; bdX.drawImage(c, 0, 0, 540, 960); bdX.filter = 'none';   // vidro: fundo desfocado 12 px
  x.save();
  x.translate(CX + camX(t) * 0.3, CY); x.scale(bgScale(t), bgScale(t)); x.translate(-CX, -CY);
  cards(T, iso);
  x.restore();
  kinetic(t);

  // palavra (1x)
  const flash = [[6.5, MAINCOL], [12.0, WH]].find(([s]) => { const f0 = Math.round(s * FPS); return fl === f0 - 2 || fl === f0 - 1; });
  const br = breathe(t), glow = 0.8 + 0.2 * (br - 1) / 0.02;
  if (t < 2.5) {
    drawWord({ glow, letter: i => {
      const st = 0.2 + i * 0.09, s = spring(t - st), v = (spring(t - st + 0.01) - s) / 0.01;
      return { dy: (1 - s) * 40, a: clamp((t - st) / 0.25), vy: -v * 40 };
    } });
    placeWord({ dx: camX(t) });
  } else if (t < 4.5) {
    const p = easeOutExpo(prog(t, 2.5, 1.4));
    drawWord({ glow });
    const sc = lerp(2.2, 1, p) * br;
    placeWord({ scale: sc, blur: lerp(12, 0, p) });
    const sp = prog(t, 3.5, 0.9);
    if (sp > 0 && sp < 1) sheen(easeInOut(sp), sc);
  } else if (t < 6.5) {
    drawWord({ glow });
    const p = easeInOut(prog(t, 4.6, 0.8)), left = CX - 500, right = CX + 500, ex = lerp(left, right, p);
    placeWord({ scale: br, clipX: [0, ex] });
    if (p > 0 && p < 1) {                                   // borda ciano de 2 px brilhando na varredura
      x.save(); x.shadowColor = MAINCOL; x.shadowBlur = 24; x.fillStyle = MAINCOL;
      x.fillRect(ex - 1, CY - 200, 2, 400); x.fillRect(ex - 1, CY - 200, 2, 400); x.restore();
    }
  } else if (t < 8.5) {
    drawWord({ glow });
    if (burstAt(fl)) glitchWord(frame, br); else placeWord({ scale: br });
  } else if (t < 12) {
    drawWord({ glow });
    const rack = t >= 10.5 ? Math.sin(Math.PI * prog(t, 10.5, 1.5)) : 0;   // o foco vai para os cards e volta
    placeWord({ scale: br, dx: camX(t), blur: rack * 8, alpha: 1 - rack * 0.5 });
  } else if (t < 13) {
    drawWord({ glow: glow * 1.2 });
    placeWord({ scale: br });
  } else {
    drawWord({ glow });
    const pts = dustPoints(), front = lerp(CX - 500, CX + 500, prog(t, 13.0, 1.0));
    placeWord({ scale: br, clipX: [front, W] });
    for (let k = 0; k < pts.length; k += 2) {
      const [px, py] = pts[k];
      const t0 = 13.0 + (px - (CX - 500)) / 1000 * 1.0, u = (t - t0) / 1.1;
      if (u <= 0 || u >= 1) continue;
      const vy = 80 + hash(k) * 160, vx = (hash(k + 1) - 0.5) * 60;
      x.globalAlpha = (1 - u) * (1 - u);
      const s = 7 * (1 - u * 0.5);
      x.drawImage(SPR[hash(k + 2) > 0.8 ? COMP : MAINCOL], px + vx * u * 1.1 - s / 2, py - vy * u * 1.1 - s / 2, s, s);
    }
    x.globalAlpha = 1;
  }

  // primeiro plano (1.6x) e linhas de luz
  foreground(t, iso);
  lightTrails(t);

  bloom(bloomA(t));
  if (flash) {
    x.fillStyle = flash[1]; x.fillRect(0, 0, W, H);
  }
  if (impactAt(fl)) aberration();
  finish(frame);
}

window.FPS = FPS; window.DUR = DUR; window.SIZE = [W, H]; window.render = render;
window.ready = Promise.all(['800 100px "Inter"', '100px "Unbounded"', '100px "Playfair Display"', '100px "Space Mono"', '100px "Syne"', '100px "Bodoni Moda"']
  .map(f => document.fonts.load(f, WORD))).then(() => {
  x.font = `800 100px ${MAINF}`; SIZE = 100 * 960 / x.measureText(WORD).width;
  drawWord(); dustPoints(); buildCardSprites();
  return true;
});

// navegador: ?t=N congela o segundo N; movimento reduzido mostra a palavra parada; sem parâmetros, toca em loop
const freeze = new URLSearchParams(location.search).get('t');
if (freeze !== null) window.ready.then(() => render(Math.round(parseFloat(freeze) * FPS)));
else if (matchMedia('(prefers-reduced-motion: reduce)').matches) window.ready.then(() => render(Math.round(12.5 * FPS)));
else if (!location.search.includes('render')) window.ready.then(() => {
  const t0 = performance.now();
  const tick = now => { render(Math.floor(((now - t0) / 1000 % DUR) * FPS)); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
</script>
