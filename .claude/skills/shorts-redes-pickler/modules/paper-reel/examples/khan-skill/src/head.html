<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khan-explainer skill reel (paper-reel experiment)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  KHAN-SKILL REEL — 9:16, 30fps, one scene per spoken line (hard cuts on the line breaks, like the reference),
//  two lines split by a second cut on a named word. The voice (Kokoro, local) is the clock: VOICE comes from voice.json.
// =====================================================================
const FPS = 30, W = 1080, H = 1920;
const DURATION = VOICE.duration;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 120, bottom: 300, right: 120 };
const HAND = '"Chalkboard SE", "Comic Sans MS", cursive';
const CX = 540;
const VL = (id) => VOICE.lines.find((l) => l.id === id);
// VW(id, word, n): the n-th (0-based) occurrence of word in line id -> { t0, t1 }
const VW = (id, word, n = 0) => { const L = VL(id), k = word.toLowerCase(); const hits = L.words.filter((w) => w.w.toLowerCase().replace(/[^a-z0-9']/g, '') === k); return hits[n] || hits[0] || { t0: L.t0, t1: L.t1 }; };
const CUT = (id) => Math.max(0, VL(id).t0 - 0.1);    // a scene starts just before its line

// the shot list: [t0, scene]
const SHOT_LIST = [
  [0.0,                         'hook'],
  [CUT('draw'),                 'describe'],
  [VW('draw', 'claude').t0 - 0.08, 'board'],
  [CUT('sync'),                 'sync'],
  [CUT('free'),                 'keys'],
  [VW('free', 'it').t0 - 0.08,  'laptop'],
  [CUT('catch'),                'catch'],
  [CUT('repo'),                 'repo'],
  [CUT('cta'),                  'cta'],
];
const SCENE = {
  hook: () => sceneHook(), describe: () => sceneDescribe(), board: () => sceneBoard(), sync: () => sceneSync(),
  keys: () => sceneKeys(), laptop: () => sceneLaptop(), catch: () => sceneCatch(), repo: () => sceneRepo(), cta: () => sceneCta(),
};
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
const SHOTS = SHOT_LIST.map(([t0, sc], i) => [sc, i, t0, ERA_LIST[i][1], sc]);
const TIMELINE = {
  width: W, height: H, fps: FPS, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'voice-cut',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: {},
  acts: [
    { name: '1 Hook',    role: 'build',   t0: 0, t1: CUT('draw') },
    { name: '2 How',     role: 'journey', t0: CUT('draw'), t1: CUT('catch') },
    { name: '3 Catch',   role: 'turn',    t0: CUT('catch'), t1: CUT('repo') },
    { name: '4 Payoff',  role: 'gift',    t0: CUT('repo'), t1: DURATION },
  ],
  board: SHOT_LIST.map(([t0, sc], i) => ({ t: (t0 + ERA_LIST[i][1]) / 2 + 0.3, title: sc, sound: '', next: 'cut' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
